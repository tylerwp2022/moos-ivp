name: CMake Build
on:
  push:
    branches: [ "main", "llm-integration" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
        include:
          - os: ubuntu-24.04
            os-type: debian
          - os: macos-15-intel
            os-type: darwin
          # MacOS 26 runs on arm64
          - os: macos-26
            os-type: darwin
    runs-on: ${{ matrix.os }}

    steps:
    # The fork's added apps are git submodules under ivp/src/; an empty
    # submodule directory fails at CMake configure time. Three of them
    # are private repositories, which the job's own GITHUB_TOKEN cannot
    # read, so a fine-grained personal access token with read access to
    # this repository and to moos-ivp-llm, moos-ivp-bt and moos-ivp-cap
    # is stored as the repository secret SUBMODULE_TOKEN. Without the
    # secret the public submodules still check out and the build fails
    # at configure on the private ones.
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
    - name: Install Dependencies - Debian/Ubuntu
      if: matrix.os-type == 'debian'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake build-essential patch libtiff5-dev libfltk1.3-dev freeglut3-dev libpng-dev libjpeg-dev libxinerama-dev libxft-dev libssl-dev libcurl4-openssl-dev

    - name: Install Dependencies - Mac OS X
      if: matrix.os-type == 'darwin'
      run: |
         brew install fltk libtiff autoconf automake
      shell: bash

    - name: Add moos-ivp to PATH
      run: echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

    - name: Build
      run: ./build.sh

    - name: Check build
      run: ./build-check.sh

    - name: Build Tests
      run: ./build-utests.sh

    - name: Run Tests
      working-directory: ./ivp/src_unit_tests/
      run: ./alltest.sh

