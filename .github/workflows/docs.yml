# 2026-11-20: Build the public handbook; deploy only dev after Pages is enabled.
# Human contributor: Timeo Williams; acting agent: Cline/ChatGPT.
name: Documentation website

on:
  push:
    branches: [dev]
    paths:
      - 'docs/handbook/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'docs/handbook/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: handbook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Build and validate
        run: |
          python -m mkdocs build --strict
          python scripts/docs/check_site.py site
      - name: Upload browser preview
        uses: actions/upload-artifact@v4
        with:
          name: handbook-preview
          path: site/
          retention-days: 14
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
      - name: Inspect Pages configuration
        id: pages
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/pages.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$status" = 200 ] && jq -e '.build_type == "workflow"' "$RUNNER_TEMP/pages.json" >/dev/null; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" = 404 ] || [ "$status" = 200 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### Publication needs repository-owner setup' >> "$GITHUB_STEP_SUMMARY"
            echo 'The handbook built successfully. Enable GitHub Pages with Source = GitHub Actions, allow dev in the github-pages environment, then re-run all jobs. See docs/handbook/how-to/publish-site.md on dev.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pages metadata request failed with HTTP $status" >&2
            exit 1
          fi
  deploy:
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy handbook
        id: deployment
        uses: actions/deploy-pages@v4
